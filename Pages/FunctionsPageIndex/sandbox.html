<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <viewport content="width=device-width, initial-scale=1.0"></viewport>
  <title>Sandbox</title>
  <style> 
  * {
    margin: 0;
    padding: 0;
    border-style: border-box;
  }
  
  body {
    display: flex;
    flex-direction: column;
    background-color: rgb(0, 25, 251);
  }
  h2 {
    padding: 10px;
    text-align: center;
  }
  nav {
    padding: 5px;
    margin-bottom: 15px;
  }
  main {
    padding: 10px;
  }
  .button {
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-size: 14px;
    font-style: bold;
    padding: 5px;
    background-color: rgb(153, 157, 161);
    color: blue;
    margin-left: 0px;
    margin-right: 3px;
  }
  .button:hover {
    cursor: pointer;
    text-shadow: 0 0 5px rgb(251, 250, 255);
  }

  #nameInput {
    border: 3px solid rgb(255, 255, 255);
    background-color: blue;
    color: white;
  }

  #clearSandbox {
    margin-top: 15px;
  }
  </style>
</head>
<body>
  <header>
    <h2 style="color: rgb(255, 255, 255);">Sandbox Function Runner...</h2>
  </header>
  <nav>
    <button class="button" id="runTests">Run Sandbox Tests</button>
    <button class="button" id="clearSandbox">Clear Output</button>
  </nav>
  <main>
    <input id="nameInput" type="text" placeholder="Enter a name">
    <button class="button" id="greetBtn">Greet</button>
    <content>
      <div id="outputBox" style="
    background: #000000;
    color: #0f0;
    padding: 10px;
    margin-top: 20px;
    font-family: monospace;
    border: 4px solid #0f0;
    min-height: 100px;
    ">
    Output will appear here...<br>
  </div>
</content>
</main>
  
  <script src="sandbox.js"></script>

</body>
</html>
