<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
   /* --------------------------------------------------
   GLOBAL RESET
-------------------------------------------------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* --------------------------------------------------
   BODY
-------------------------------------------------- */
body {
  background-color: rgb(92, 4, 97);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  border: 9px solid gray;
  font-family: 'Times New Roman', serif;
  color: #e6d8f0;
}

/* --------------------------------------------------
   HEADER
-------------------------------------------------- */
header {
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: black;
  width: 100%;
  padding: 20px;
  border-bottom: 4px solid gray;
}

header h1 {
  font-size: 4.5rem;
  color: rgb(92, 4, 97);
  text-shadow: 0 0 5px rgb(92, 4, 97), 0 0 5px rgb(150, 0, 150);
}

/* --------------------------------------------------
   NAVIGATION
-------------------------------------------------- */
nav {
  display: flex;
  justify-content: center;
  gap: 20px;
  width: 100%;
  padding: 15px;
  background-color: black;
  border-bottom: 4px solid gray;
}

.navButton {
  font-size: 1.8rem;
  background-color: black;
  padding: 10px 18px;
  border: 3px solid rgb(144, 144, 144);
  border-radius: 10px;
  color: rgb(200, 200, 200);
  text-decoration: none;
  transition: transform 0.2s ease, background-color 0.25s ease;
}

.navButton:hover {
  transform: translateY(-4px);
  background-color: rgb(40, 40, 40);
}

/* --------------------------------------------------
   MAIN CONTENT
-------------------------------------------------- */
main {
  flex: 1;
  padding: 30px;
  display: grid;
  place-items: center;
}

#hauntedwoods_helper {
  background-color: rgba(0, 0, 0, 0.45);
  padding: 25px;
  border: 4px solid gray;
  border-radius: 12px;
  max-width: 500px;
  width: 100%;
  backdrop-filter: blur(3px);
}

#hauntedwoods_helper h2 {
  font-size: 2.2rem;
  margin-bottom: 20px;
  text-align: center;
  color: #f0d6ff;
  text-shadow: 0 0 8px #b300ff;
}

/* --------------------------------------------------
   INPUT ENTRIES
-------------------------------------------------- */
.hw_entry {
  margin-bottom: 15px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.hw_entry label {
  font-size: 1.2rem;
  color: #e6d8f0;
}

.inputHere {
  padding: 10px;
  border: 2px solid black;
  border-radius: 6px;
  background-color: #f7f2ff;
  font-size: 1rem;
}

/* --------------------------------------------------
   OUTPUT BOX
-------------------------------------------------- */
#outputBox {
  background-color: rgba(198, 196, 193, 0.75);
  max-width: 100%;
  min-height: 200px;
  border: 3px solid black;
  padding: 15px;
  margin-top: 20px;
  border-radius: 8px;
  overflow-wrap: break-word;
  color: black;
}

/* --------------------------------------------------
   BUTTONS
-------------------------------------------------- */
#hwSend,
#hwClear {
  margin-top: 15px;
  padding: 10px 20px;
  font-size: 1.3rem;
  border: 3px solid gray;
  background-color: black;
  color: rgb(200, 200, 200);
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.2s ease, background-color 0.25s ease;
}

#hwSend:hover,
#hwClear:hover {
  transform: translateY(-3px);
  background-color: rgb(40, 40, 40);
}

/* --------------------------------------------------
   FOOTER
-------------------------------------------------- */
footer {
  display: flex;
  justify-content: center;
  padding: 15px;
  background-color: black;
  color: rgb(92, 4, 97);
  font-size: 1.3rem;
  border-top: 4px solid gray;
}

/* --------------------------------------------------
   RESPONSIVE
-------------------------------------------------- */
@media (max-width: 700px) {
  header h1 {
    font-size: 3rem;
  }

  .navButton {
    font-size: 1.4rem;
    padding: 8px 12px;
  }

  #hauntedwoods_helper {
    padding: 20px;
  }
}


  </style> 
</head>
<body>
  <header>
    <h1>Haunted Woods</h1>
  </header>
  <nav class="navBar">
    <a href="/index.html" class="navButton">Home</a>
    <a href="/Pages/NeopetHub/NeopetHomepage.html" class='navButton' > Neopet Page</a>
    <a href="/Pages/GameRoomIndex/GameRoom.html" class="navButton">Game Room</a>
    <a href="/Pages/FunctionsPageIndex/Functions.html" class="navButton">Functions Page</a>

  </nav>
  <main>

    <div id="hauntedwoods_helper">
      
      <h2>Haunted Woods Tracker</h2>
      
      <div class="hw_entry">
        <label>Entry 1</label>
        <input id="hw1" class="inputHere" type="text" placeholder="Enter location or note">
      </div>
      
      <div class="hw_entry">
        <label>Entry 2</label>
        <input id="hw2" class="inputHere" type="text" placeholder="Enter location or note">
      </div>
      
      <div class="hw_entry">
        <label>Entry 3</label>
        <input id="hw3" class="inputHere" type="text" placeholder="Enter location or note">
      </div>
      
      <div class="hw_entry">
        <label>Entry 4</label>
        <input id="hw4" class="inputHere" type="text" placeholder="Enter location or note">
      </div>
      <div id='outputBox'></div>
      
      <button id="hwSend">Send</button>
      <button id="hwClear">Clear</button>
      
    </div>
    <button id="ghostBtn">Summon Ghost</button>
    <div id="ghostBox"></div>
    <button id="countBtn">Increase</button>
    <div id="countDisplay">0</div>

  </main>
  <footer>Reached the bottom of the page</footer>
    
    <script>
      //helper functions
      function $(element) {
        return document.querySelector(element);
      };
      //
      const hw1 = $('#hw1');
const hw2 = $('#hw2');
const hw3 = $('#hw3');
const hw4 = $('#hw4');
const outputBox = $('#outputBox');
const clear = $('#hwClear');
const send = $('#hwSend');
// Grab all four inputs at once
const inputs = document.querySelectorAll('.inputHere');
// Delegate logic: one button controls all inputs
send.addEventListener('click', () => {
  // Clear the output box before adding new lines (optional)
  outputBox.textContent = "";
  // Loop through all inputs
  inputs.forEach(input => {
    // Read the value
    const value = input.value.trim();
    // Skip empty inputs
    if (value === "") return;
    // Add the value on its own line
    const line = document.createElement('div');
line.textContent = value;
outputBox.append(line);

  });
});

  clear.addEventListener('click', () => {
  outputBox.textContent = "";   // clears the output
  inputs.forEach(input => input.value = "");   // clears all four inputs

});


clear.addEventListener('click', () => {
  outputBox.textContent = "";   // clears the output
  inputs.forEach(input => input.value = "");   // clears all four inputs
});


// ------------------ GHOST BUTTON ------------------

const ghostBtn = $('#ghostBtn');
const ghostBox = $('#ghostBox');

ghostBtn.addEventListener('click', () => {
  if (ghostBox.textContent === "") {
    ghostBox.textContent = "👻 Boo!";
  } else {
    ghostBox.textContent = "";
  }
});


// ------------------ COUNTER ------------------

const countDisplay = $('#countDisplay');
const countBtn = $('#countBtn');
let count = 0;

countBtn.addEventListener('click', () => {
  count++;

  // Update display
  countDisplay.textContent = count;

  // Reset shake if needed
  countDisplay.classList.remove('shake');

  if (count < 5) {
    countDisplay.style.color = 'green';
  }

  else if (count >= 5 && count < 10) {
    countDisplay.style.color = 'yellow';
  }

  else if (count >= 10) {
    countDisplay.style.color = 'red';
    countDisplay.classList.add('shake');
  }
});



  </script>
</body>
</html>
